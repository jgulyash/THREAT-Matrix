name: New Tactic Suggestion
description: Suggest a new tactic to add to the THREAT Matrix framework
title: "[Tactic] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        > **Do not post real incident data.** This issue will be public, indexed by search engines, and effectively permanent, including its edit history. Do not include the name of any person or anything that could identify one, any detail of a real incident that is not already in a published public source, anything from an open or non-public investigation, or confidential employer or client material. Use fictionalized examples or cited public sources only. To report a security or privacy problem, follow SECURITY.md instead of opening a detailed issue.

        Thank you for suggesting a new tactic. The THREAT Matrix evolves through practitioner contribution.

        **Source quality matters.** Government reports (NTAC, DHS, DOE), academic research, court documents, and after-action reviews carry the most weight. News articles are acceptable as supporting evidence but should not be the sole source.

  - type: input
    id: tactic-name
    attributes:
      label: Tactic Name
      description: >
        A short, behavior-first name describing what the adversary is doing.
        Example: "Physical Surveillance" not "Surveillance Threat."
      placeholder: e.g., Supply Chain Infiltration
    validations:
      required: true

  - type: dropdown
    id: target-matrix
    attributes:
      label: Target Matrix
      description: Which matrix does this tactic belong to?
      options:
        - Person
        - Facility
        - Organization
        - Infrastructure
    validations:
      required: true

  - type: dropdown
    id: phase
    attributes:
      label: Proposed Phase
      description: Which phase of the Threat Lifecycle does this behavior occur in?
      options:
        - "Phase 1: Target Development"
        - "Phase 2: Mobilization"
        - "Phase 3: Execution"
        - "Phase 4: Aftermath"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: >
        Describe the adversary behavior in 2-4 sentences using operational terms.
        Focus on what the adversary is doing, not what defenders are worried about.
      placeholder: |
        Describe the behavior: what does the adversary do, how, and in what context?
        If the behavior spans multiple phases, explain why you placed it in the selected phase.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence and Sources
      description: >
        At least one published source is required. All framework data must be grounded in
        observed or feasible adversary behavior with cited public sources. Do not describe a
        real case from your own work or name any person; cite what is already published. Preferred source types:
        government reports (NTAC, DHS, DOE, LLNL), academic/peer-reviewed research, court
        documents, after-action reviews. News articles are acceptable as supporting evidence.
      placeholder: |
        - [Required] Primary source: title, author/org, year, URL or document reference
        - [Optional] Additional supporting sources
    validations:
      required: true

  - type: textarea
    id: related-tactics
    attributes:
      label: Related Existing Tactics
      description: >
        List any existing tactics (by ID or name) that are related to this suggestion.
        This helps evaluate placement and avoid duplication.
      placeholder: |
        e.g., TM0103 (Environmental Survey) - this tactic would precede the environmental survey in the Threat Lifecycle
    validations:
      required: false

  - type: textarea
    id: actor-profiles
    attributes:
      label: Applicable Actor Profiles
      description: >
        Which actor profiles would use this tactic? Reference by ID (APxxx) or category name.
        Categories: Lone Actor, Insider, Criminal, Corporate Espionage, Ideological, Nation-State, Customer/Client Aggressor.
      placeholder: |
        e.g., AP012 (Corporate Spy), Nation-State category broadly
    validations:
      required: false

  - type: checkboxes
    id: modality
    attributes:
      label: Behavioral Mode
      description: Which operational surfaces does this behavior run on? Select all that apply.
      options:
        - label: Physical
          required: false
        - label: Cyber
          required: false
        - label: Cyber-physical
          required: false
        - label: Human / social
          required: false

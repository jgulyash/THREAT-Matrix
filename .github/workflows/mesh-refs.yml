name: Mesh Refs

# Checks the Detection Mesh relations in docs/data/framework.json:
#   indicator.correlates_with          -> existing indicator IDs, symmetric
#   countermeasure.compensates_for     -> existing countermeasure IDs only
#   countermeasure.mitigates           -> edges to existing indicator IDs
#   response_protocol.coordinates_with -> existing response protocol IDs
# No self-reference, no duplicate, and a document with zero indicators fails.
# The same command also runs inside the Framework Validator workflow and in
# the pre-commit hook (scripts/git-hooks/pre-commit, against staged content).

on:
  pull_request:
    branches:
      - main
      - v1-build
      - v3-design
  push:
    branches:
      - main
      - v1-build
      - v3-design

concurrency:
  group: mesh-refs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mesh-refs:
    name: Validate Detection Mesh references
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'

      - name: Run mesh-refs lint
        run: python3 scripts/lint/mesh-refs.py docs/data/framework.json

name: Bundle Freshness

# The viewer bundles docs/data/framework.json and src/ into hashed files
# under docs/assets at build time, and bakes those file names into
# docs/index.html. This workflow proves the committed build output is
# exactly what a fresh build of the committed sources produces:
#
#   1. docs/index.html references exactly the files present in docs/assets
#      (no missing bundle, no stale or stray file).
#   2. After deleting docs/assets and rebuilding, docs/index.html and every
#      file under docs/assets are byte-identical to the committed ones, and
#      the build created no file that is not committed.
#
# The pre-commit hook at scripts/git-hooks/pre-commit runs check 1 against
# staged content and requires the bundle to be staged with its inputs; it
# does not run the build. This workflow is the gate that rebuilds.

on:
  pull_request:
    branches:
      - main
      - v1-build
      - v3-design
  push:
    branches:
      - main
      - v1-build
      - v3-design

concurrency:
  group: bundle-freshness-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bundle-freshness:
    name: Verify committed bundle equals a fresh build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.9

      - name: Committed index.html references exactly the committed assets
        run: python3 scripts/git-hooks/check-bundle-refs.py .

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Rebuild bundle from scratch
        run: |
          set -eu
          rm -rf docs/assets
          bun run build

      - name: Fresh build equals the committed build output
        run: |
          set -eu
          status=0
          if ! git diff --exit-code --stat -- docs/index.html docs/assets; then
            echo "FAILED: a fresh build changed or removed committed build output (listed above)." >&2
            status=1
          fi
          untracked="$(git status --porcelain --untracked-files=all -- docs/index.html docs/assets)"
          if [ -n "$untracked" ]; then
            echo "FAILED: build output differs from what is committed:" >&2
            printf '%s\n' "$untracked" >&2
            status=1
          fi
          if [ "$status" -ne 0 ]; then
            echo "" >&2
            echo "The committed docs/index.html and docs/assets are not what the committed" >&2
            echo "sources build. To fix locally:" >&2
            echo "  rm -f docs/assets/index-*" >&2
            echo "  bun run build" >&2
            echo "  git add -A docs/assets docs/index.html" >&2
            exit 1
          fi
          echo "PASSED: docs/index.html and docs/assets are byte-identical to a fresh build."

      - name: Fresh index.html references exactly the fresh assets
        run: python3 scripts/git-hooks/check-bundle-refs.py .

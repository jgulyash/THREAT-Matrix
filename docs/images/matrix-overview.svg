<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif">

  <!-- Drop shadow for cards (matches SPA light-mode .dp-card) -->
  <defs>
    <filter id="cardShadow" x="-2%" y="-5%" width="104%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Outer canvas -->
  <rect width="900" height="420" fill="#FFFFFF" rx="6" stroke="#B8BEC7" stroke-width="1"/>

  <!-- Header strip -->
  <line x1="0" y1="44" x2="900" y2="44" stroke="#B8BEC7" stroke-width="1"/>
  <text x="24" y="28" fill="#F78B04" font-size="15" font-weight="700" font-style="italic" letter-spacing="1.4">THREAT</text>
  <text x="98" y="28" fill="#0F172A" font-size="15" font-weight="700" letter-spacing="1.4">MATRIX</text>
  <text x="876" y="28" fill="#475569" font-size="11" font-weight="700" letter-spacing="1.6" text-anchor="end">TARGET MATRICES</text>

  <!-- ── PERSON (top left) — amber accent ── -->
  <rect x="16" y="60" width="428" height="160" fill="#FFFFFF" rx="6" stroke="#B8BEC7" stroke-width="1" filter="url(#cardShadow)"/>
  <rect x="16" y="60" width="428" height="4" fill="#F78B04" rx="6"/>
  <rect x="16" y="62" width="428" height="2" fill="#F78B04"/>
  <text x="28" y="86" fill="#F78B04" font-size="11" font-weight="700" letter-spacing="1.8">PERSON</text>
  <text x="28" y="108" fill="#0F172A" font-size="18" font-weight="700">Person</text>
  <line x1="28" y1="120" x2="432" y2="120" stroke="#E2E8F0" stroke-width="1"/>
  <text x="28" y="138" fill="#8A94A1" font-size="11" letter-spacing=".04em">Target: Specific Individual</text>
  <text x="28" y="158" fill="#475569" font-size="13">Fixated individuals · Assassination · Kidnapping · Stalking</text>
  <!-- V1.1 LIVE badge (teal — success) -->
  <rect x="28" y="175" width="68" height="20" fill="rgba(3,117,134,0.10)" rx="2"/>
  <line x1="28" y1="175" x2="28" y2="195" stroke="#037586" stroke-width="2"/>
  <text x="62" y="189" fill="#037586" font-size="10" font-weight="700" letter-spacing=".10em" text-anchor="middle">V1.1 LIVE</text>
  <!-- 34 tactics badge (amber) -->
  <rect x="104" y="175" width="74" height="20" fill="rgba(247,139,4,0.10)" rx="2"/>
  <line x1="104" y1="175" x2="104" y2="195" stroke="#F78B04" stroke-width="2"/>
  <text x="141" y="189" fill="#F78B04" font-size="10" font-weight="700" letter-spacing=".06em" text-anchor="middle">34 TACTICS</text>

  <!-- ── FACILITY (top right) — teal accent ── -->
  <rect x="456" y="60" width="428" height="160" fill="#FFFFFF" rx="6" stroke="#B8BEC7" stroke-width="1" filter="url(#cardShadow)"/>
  <rect x="456" y="60" width="428" height="4" fill="#037586" rx="6"/>
  <rect x="456" y="62" width="428" height="2" fill="#037586"/>
  <text x="468" y="86" fill="#037586" font-size="11" font-weight="700" letter-spacing="1.8">FACILITY</text>
  <text x="468" y="108" fill="#0F172A" font-size="18" font-weight="700">Facility</text>
  <line x1="468" y1="120" x2="872" y2="120" stroke="#E2E8F0" stroke-width="1"/>
  <text x="468" y="138" fill="#8A94A1" font-size="11" letter-spacing=".04em">Target: Physical Location</text>
  <text x="468" y="158" fill="#475569" font-size="13">Active shooter · IED/VBIED · Venue/campus attack</text>
  <!-- V1.3 IN PROGRESS badge (amber) -->
  <rect x="468" y="175" width="132" height="20" fill="rgba(247,139,4,0.10)" rx="2"/>
  <line x1="468" y1="175" x2="468" y2="195" stroke="#F78B04" stroke-width="2"/>
  <text x="538" y="189" fill="#F78B04" font-size="10" font-weight="700" letter-spacing=".06em" text-anchor="middle">V1.3 IN PROGRESS</text>
  <!-- 40 tactics badge (teal) -->
  <rect x="608" y="175" width="74" height="20" fill="rgba(3,117,134,0.10)" rx="2"/>
  <line x1="608" y1="175" x2="608" y2="195" stroke="#037586" stroke-width="2"/>
  <text x="645" y="189" fill="#037586" font-size="10" font-weight="700" letter-spacing=".06em" text-anchor="middle">40 TACTICS</text>

  <!-- ── ORGANIZATION (bottom left) — red accent ── -->
  <rect x="16" y="232" width="428" height="160" fill="#FFFFFF" rx="6" stroke="#B8BEC7" stroke-width="1" filter="url(#cardShadow)"/>
  <rect x="16" y="232" width="428" height="4" fill="#A30502" rx="6"/>
  <rect x="16" y="234" width="428" height="2" fill="#A30502"/>
  <text x="28" y="258" fill="#A30502" font-size="11" font-weight="700" letter-spacing="1.8">ORGANIZATION</text>
  <text x="28" y="280" fill="#0F172A" font-size="18" font-weight="700">Organization</text>
  <line x1="28" y1="292" x2="432" y2="292" stroke="#E2E8F0" stroke-width="1"/>
  <text x="28" y="310" fill="#8A94A1" font-size="11" letter-spacing=".04em">Target: The Enterprise (trusted-access adversary)</text>
  <text x="28" y="330" fill="#475569" font-size="13">Insider threat · Corporate espionage · Organizational sabotage</text>
  <!-- V1.4 IN PROGRESS badge (amber) -->
  <rect x="28" y="347" width="132" height="20" fill="rgba(247,139,4,0.10)" rx="2"/>
  <line x1="28" y1="347" x2="28" y2="367" stroke="#F78B04" stroke-width="2"/>
  <text x="98" y="361" fill="#F78B04" font-size="10" font-weight="700" letter-spacing=".06em" text-anchor="middle">V1.4 IN PROGRESS</text>
  <!-- 42 tactics badge (red) -->
  <rect x="168" y="347" width="74" height="20" fill="rgba(163,5,2,0.10)" rx="2"/>
  <line x1="168" y1="347" x2="168" y2="367" stroke="#A30502" stroke-width="2"/>
  <text x="205" y="361" fill="#A30502" font-size="10" font-weight="700" letter-spacing=".06em" text-anchor="middle">42 TACTICS</text>

  <!-- ── INFRASTRUCTURE (bottom right) — blue accent ── -->
  <rect x="456" y="232" width="428" height="160" fill="#FFFFFF" rx="6" stroke="#B8BEC7" stroke-width="1" filter="url(#cardShadow)"/>
  <rect x="456" y="232" width="428" height="4" fill="#1E3A5F" rx="6"/>
  <rect x="456" y="234" width="428" height="2" fill="#1E3A5F"/>
  <text x="468" y="258" fill="#1E3A5F" font-size="11" font-weight="700" letter-spacing="1.8">INFRASTRUCTURE</text>
  <text x="468" y="280" fill="#0F172A" font-size="18" font-weight="700">Infrastructure</text>
  <line x1="468" y1="292" x2="872" y2="292" stroke="#E2E8F0" stroke-width="1"/>
  <text x="468" y="310" fill="#8A94A1" font-size="11" letter-spacing=".04em">Target: Critical Infrastructure</text>
  <text x="468" y="330" fill="#475569" font-size="13">Power · Water · Comms · ICS/OT · Cyber-physical attacks</text>
  <!-- V1.5 IN PROGRESS badge (amber) -->
  <rect x="468" y="347" width="132" height="20" fill="rgba(247,139,4,0.10)" rx="2"/>
  <line x1="468" y1="347" x2="468" y2="367" stroke="#F78B04" stroke-width="2"/>
  <text x="538" y="361" fill="#F78B04" font-size="10" font-weight="700" letter-spacing=".06em" text-anchor="middle">V1.5 IN PROGRESS</text>
  <!-- 38 tactics badge (blue) -->
  <rect x="608" y="347" width="74" height="20" fill="rgba(30,58,95,0.10)" rx="2"/>
  <line x1="608" y1="347" x2="608" y2="367" stroke="#1E3A5F" stroke-width="2"/>
  <text x="645" y="361" fill="#1E3A5F" font-size="10" font-weight="700" letter-spacing=".06em" text-anchor="middle">38 TACTICS</text>

  <!-- Footer (matches .det-deferred styling) -->
  <text x="450" y="411" fill="#8A94A1" font-size="11" text-anchor="middle" font-style="italic">154 total tactics across four target domains — Person, Facility, Organization, Infrastructure</text>

</svg>
